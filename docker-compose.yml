# Orchestrates the 3 Multi-Zones apps (design.md "Architecture Overview").
# `shell` is the entry point; its `next.config.ts` `rewrites()` proxy
# "/", "/dashboard/*" to mf-dashboard and "/transactions/*" to
# mf-transactions using the origins below (Docker's internal service DNS).
#
# Usage: docker compose up --build
# Shell is reachable at http://localhost:3000 (INFRA-01).
#
# MF_DASHBOARD_ORIGIN/MF_TRANSACTIONS_ORIGIN are passed as *build args*, not
# just runtime env — Next.js evaluates next.config.ts's rewrites() during
# `next build` and bakes the result into .next/routes-manifest.json, so
# setting them only at container-start time silently produces empty
# rewrites (verified by inspecting the manifest at build time).

services:
  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
      args:
        MF_DASHBOARD_ORIGIN: ${MF_DASHBOARD_ORIGIN:-http://mf-dashboard:3001}
        MF_TRANSACTIONS_ORIGIN: ${MF_TRANSACTIONS_ORIGIN:-http://mf-transactions:3002}
    ports:
      - '3000:3000'
    environment:
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      - mf-dashboard
      - mf-transactions

  mf-dashboard:
    build:
      context: .
      dockerfile: apps/mf-dashboard/Dockerfile
    ports:
      - '3001:3001'
    environment:
      API_BASE_URL: ${API_BASE_URL}

  mf-transactions:
    build:
      context: .
      dockerfile: apps/mf-transactions/Dockerfile
    ports:
      - '3002:3002'
    environment:
      API_BASE_URL: ${API_BASE_URL}
